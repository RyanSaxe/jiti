name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install ripgrep and ast-grep (required by jiti's grep/sg tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          curl -fsSL https://github.com/ast-grep/ast-grep/releases/latest/download/app-x86_64-unknown-linux-gnu.zip -o /tmp/ast-grep.zip
          unzip -q /tmp/ast-grep.zip -d /tmp/ast-grep
          sudo install -m 0755 /tmp/ast-grep/sg /usr/local/bin/sg
          sudo install -m 0755 /tmp/ast-grep/ast-grep /usr/local/bin/ast-grep
          rg --version | head -n1
          sg --version

      - name: Install dependencies
        run: uv sync

      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # The same hooks contributors run locally: ruff-format, ruff, ty.
      - name: Lint, format, and type-check (pre-commit hooks)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Tests
        run: uv run pytest --cov=jiti --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
