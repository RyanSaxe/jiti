[project]
name = "jiti"
version = "1.2.0"
description = "Just In Time Implementation: declare a typed function or method by its interface and let an LLM write, validate, and cache a real implementation."
readme = "README.md"
authors = [
    { name = "Ryan Saxe", email = "ryancsaxe+1@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
keywords = ["llm", "codegen", "ai", "anthropic", "claude", "litellm", "tdd", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "litellm>=1.85.0",
    "pydantic>=2.13.4",
    "ruff>=0.15.14",
    "ty>=0.0.39",
]

[project.scripts]
jiti = "jiti.cli:main"

[project.urls]
Homepage = "https://github.com/RyanSaxe/jiti"
Repository = "https://github.com/RyanSaxe/jiti"
Issues = "https://github.com/RyanSaxe/jiti/issues"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ty.rules]
# jiti stubs intentionally have empty bodies with non-None return types — that is the
# whole point. Disable ty's empty-body rule so stubs (and our stub fixtures) type-check.
empty-body = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["jiti"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.semantic_release]
# Releases are driven by conventional-commit messages (feat:, fix:, BREAKING CHANGE).
# The version lives only in pyproject.toml; PSR stamps it, then re-syncs uv.lock.
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
build_command = """
pip install uv
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
uv build
"""
