[project]
name = "jiti"
version = "0.1.0"
description = "Just In Time Implementation: declare a typed function or method by its interface and let an LLM write, validate, and cache a real implementation."
readme = "README.md"
authors = [
    { name = "Ryan Saxe", email = "ryancsaxe+1@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
keywords = ["llm", "codegen", "ai", "anthropic", "claude", "tdd", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=0.104.1",
    "ruff>=0.15.14",
    "ty>=0.0.39",
]

[project.urls]
Homepage = "https://github.com/RyanSaxe/jiti"
Repository = "https://github.com/RyanSaxe/jiti"
Issues = "https://github.com/RyanSaxe/jiti/issues"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ty.rules]
# jiti stubs intentionally have empty bodies with non-None return types — that is the
# whole point. Disable ty's empty-body rule so stubs (and our stub fixtures) type-check.
empty-body = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
